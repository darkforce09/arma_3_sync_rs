[package]
name = "a3s_transport"
description = "Async transports (HTTP(S), FTP(S), SFTP, WebDAV) for Arma3Sync repositories."
authors.workspace = true
edition.workspace = true
homepage.workspace = true
include.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
a3s_types.workspace = true
base64.workspace = true
bytes.workspace = true
futures.workspace = true
parking_lot.workspace = true
reqwest = { workspace = true, features = ["rustls", "http2", "socks", "stream"] }
russh.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
russh-sftp.workspace = true
suppaftp = { workspace = true, features = ["tokio-rustls-aws-lc-rs"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls.workspace = true
tokio-socks.workspace = true
tokio-util = { workspace = true, features = ["io"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
a3s_repo_files.workspace = true
a3s_test_servers.workspace = true
axum.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
