[package]
name = "arma3sync"
description = "The `arma3sync` binary: command line interface and interactive console."
authors.workspace = true
edition.workspace = true
homepage.workspace = true
include.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
a3s_admin.workspace = true
a3s_foundation.workspace = true
a3s_repo_files.workspace = true
a3s_sync.workspace = true
a3s_tools.workspace = true
a3s_transport.workspace = true
a3s_types.workspace = true
a3s_updater.workspace = true
chrono.workspace = true
clap.workspace = true
parking_lot.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }

[[bin]]
name = "arma3sync"
path = "src/main.rs"
# The library is also called `arma3sync`; documenting both collides.
doc = false
