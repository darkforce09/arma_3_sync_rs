[package]
name = "a3s_viewer_context"
description = "Application state, command bus, background tasks and periodic repository checks of the Arma3Sync viewer."
authors.workspace = true
edition.workspace = true
homepage.workspace = true
include.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
a3s_foundation.workspace = true
a3s_repo_files.workspace = true
a3s_sync.workspace = true
a3s_transport.workspace = true
a3s_types.workspace = true
futures.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
