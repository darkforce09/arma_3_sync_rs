[package]
name = "a3s_viewer"
description = "The Arma3Sync desktop window: toolbar, sidebar, screens, sheets, toasts and tray."
authors.workspace = true
edition.workspace = true
homepage.workspace = true
include.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
a3s_addons.workspace = true
a3s_foundation.workspace = true
a3s_launch.workspace = true
a3s_platform.workspace = true
a3s_repo_files.workspace = true
a3s_sync.workspace = true
a3s_tools.workspace = true
a3s_transport.workspace = true
a3s_types.workspace = true
a3s_ui.workspace = true
a3s_updater.workspace = true
a3s_viewer_context.workspace = true
chrono.workspace = true
eframe = { workspace = true, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
egui.workspace = true
egui_dnd.workspace = true
egui-toast.workspace = true
futures.workspace = true
notify-rust.workspace = true
parking_lot.workspace = true
rfd.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon.workspace = true

[dev-dependencies]
a3s_test_servers.workspace = true
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
