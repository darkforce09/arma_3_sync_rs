# https://github.com/crate-ci/typos
# install:  cargo install typos-cli
# run:      typos

[files]
extend-exclude = ["java_version/", "target/", "tests/fixtures/", "*.svg", "*.ttf"]

[default]
# Hex digests (SHA-1 values in tests).
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b"]

[default.extend-words]
# Names that are part of the Java wire format and must stay misspelled.
configration = "configration"
Protocole = "Protocole"
protocole = "protocole"
racine = "racine"
hidddenFolderPaths = "hidddenFolderPaths"
Synk = "Synk"
Connexion = "Connexion"
Zync = "Zync"
hiddden = "hiddden"
# Java texts kept verbatim.
occured = "occured"
Incompete = "Incompete"
priviledges = "priviledges"
anormaly = "anormaly"
LAF = "LAF"
Laf = "Laf"
# Java API names called by the fixture harness.
Localy = "Localy"
Builded = "Builded"
Leafs = "Leafs"
# Windows command-line switches (`tasklist /FO CSV`).
FO = "FO"
