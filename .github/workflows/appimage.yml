name: AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  appimage:
    name: AppImage (x86_64)
    # The AppImage runs on systems with the build machine's glibc or newer: build on an old one.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libxdo-dev
      - run: packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Arma3Sync-AppImage
          path: target/appimage/*.AppImage
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes)
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" target/appimage/*.AppImage "${flags[@]}"
