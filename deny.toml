# https://embarkstudios.github.io/cargo-deny/
#
# cargo install cargo-deny
# cargo deny check

[graph]
targets = [
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-apple-darwin" },
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "x86_64-unknown-linux-gnu" },
]
all-features = true

[advisories]
version = 2
ignore = [
  # Marvin attack: timing side channel in RSA *private-key* operations (decrypt/sign).
  # Pulled in by russh's default `rsa` feature. Arma3Sync only uses SFTP password auth and
  # verifies server host-key signatures (public-key operations), so it never performs the
  # affected operations. Keeping `rsa` is needed for servers with RSA host keys.
  # Re-evaluate if client public-key authentication is ever added.
  { id = "RUSTSEC-2023-0071", reason = "only public-key RSA operations are used (SFTP host key verification)" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { name = "openssl", reason = "Use rustls" },
  { name = "openssl-sys", reason = "Use rustls" },
]
skip = []
skip-tree = []

[licenses]
version = 2
private = { ignore = true }
confidence-threshold = 0.93
allow = [
  "0BSD",
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-or-later",
  "ISC",
  "MIT-0",
  "MIT",
  "MPL-2.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
