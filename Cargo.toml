[workspace]
resolver = "3"
members = [
  "crates/build/*",
  "crates/game/*",
  "crates/net/*",
  "crates/store/*",
  "crates/top/*",
  "crates/utils/*",
  "crates/viewer/*",
]

[workspace.package]
authors = ["Arma3Sync-rs contributors"]
edition = "2024"
homepage = "https://github.com/vpzbrig21/Arma3Sync"
include = ["../../LICENSE", "**/*.rs", "Cargo.toml"]
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/vpzbrig21/Arma3Sync"
rust-version = "1.95"
version = "0.1.0-alpha.1"

[workspace.dependencies]
# ---------------------------------------------------------------------------------
# Own crates. Keep sorted by group, then name.

# build
a3s_build_info = { path = "crates/build/a3s_build_info", version = "=0.1.0-alpha.1", default-features = false }
a3s_dev_tools = { path = "crates/build/a3s_dev_tools", version = "=0.1.0-alpha.1", default-features = false }

# game
a3s_addons = { path = "crates/game/a3s_addons", version = "=0.1.0-alpha.1", default-features = false }
a3s_launch = { path = "crates/game/a3s_launch", version = "=0.1.0-alpha.1", default-features = false }
a3s_platform = { path = "crates/game/a3s_platform", version = "=0.1.0-alpha.1", default-features = false }
a3s_tools = { path = "crates/game/a3s_tools", version = "=0.1.0-alpha.1", default-features = false }

# net
a3s_admin = { path = "crates/net/a3s_admin", version = "=0.1.0-alpha.1", default-features = false }
a3s_sync = { path = "crates/net/a3s_sync", version = "=0.1.0-alpha.1", default-features = false }
a3s_transport = { path = "crates/net/a3s_transport", version = "=0.1.0-alpha.1", default-features = false }

# store
a3s_hash = { path = "crates/store/a3s_hash", version = "=0.1.0-alpha.1", default-features = false }
a3s_jserial = { path = "crates/store/a3s_jserial", version = "=0.1.0-alpha.1", default-features = false }
a3s_repo_files = { path = "crates/store/a3s_repo_files", version = "=0.1.0-alpha.1", default-features = false }
a3s_types = { path = "crates/store/a3s_types", version = "=0.1.0-alpha.1", default-features = false }
a3s_zsync = { path = "crates/store/a3s_zsync", version = "=0.1.0-alpha.1", default-features = false }

# top
a3s_updater = { path = "crates/top/a3s_updater", version = "=0.1.0-alpha.1", default-features = false }
arma3sync = { path = "crates/top/arma3sync", version = "=0.1.0-alpha.1", default-features = false }

# utils
a3s_error = { path = "crates/utils/a3s_error", version = "=0.1.0-alpha.1", default-features = false }
a3s_format = { path = "crates/utils/a3s_format", version = "=0.1.0-alpha.1", default-features = false }
a3s_log = { path = "crates/utils/a3s_log", version = "=0.1.0-alpha.1", default-features = false }
a3s_paths = { path = "crates/utils/a3s_paths", version = "=0.1.0-alpha.1", default-features = false }

# viewer
a3s_ui = { path = "crates/viewer/a3s_ui", version = "=0.1.0-alpha.1", default-features = false }
a3s_viewer = { path = "crates/viewer/a3s_viewer", version = "=0.1.0-alpha.1", default-features = false }
a3s_viewer_context = { path = "crates/viewer/a3s_viewer_context", version = "=0.1.0-alpha.1", default-features = false }

# ---------------------------------------------------------------------------------
# External crates. Keep sorted.
aes = "0.9.3"
anyhow = { version = "1.0", default-features = false, features = ["std"] }
axum = "0.8.9"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
crossbeam-channel = "0.5.17"
dav-server = "0.11.0"
directories = "6.0.0"
ecb = "0.2.1"
eframe = { version = "0.36.2", default-features = false }
egui = "0.36.2"
egui_extras = "0.36.2"
egui_kittest = "0.36.2"
flate2 = "1.1"
fs4 = "1.1.0"
futures = "0.3.34"
insta = "1.49"
interprocess = "2.4"
libunftp = { version = "0.23.1", default-features = false, features = ["aws_lc_rs"] }
md4 = "0.11.0"
mslnk = "0.1.8"
parking_lot = "0.12.5"
percent-encoding = "2.3"
proptest = "1.11"
rayon = "1.12"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
regex = "1.13"
reqwest = { version = "0.13.5", default-features = false }
resvg = { version = "0.45.1", default-features = false }
rfd = "0.17.2"
roxmltree = "0.21.1"
russh = "0.64.1"
russh-sftp = "3.0.1"
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.152"
sha1 = "0.11.0"
sha2 = "0.11.0"
suppaftp = "12.1"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-util = "0.7.20"
toml = "1.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tray-icon = "0.26.1"
unftp-sbe-fs = "0.4.0"
url = "2.5"
winreg = "0.56.0"
zip = { version = "9.0", default-features = false, features = ["deflate"] }

[profile.dev]
opt-level = 1 # Hashing, zsync and egui are painfully slow at opt-level 0.
debug = "line-tables-only" # Smaller target dirs and faster links; backtraces keep line numbers.

[profile.dev.package."*"]
opt-level = 2

[profile.release]
# Keep debug info out of the binary but symbols for useful backtraces.
debug = false
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true

# ---------------------------------------------------------------------------------
# Lints, modeled on rerun's workspace lint set.

[workspace.lints.rust]
unsafe_code = "deny"

elided_lifetimes_in_paths = "warn"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2021_prelude_collisions = "warn"
semicolon_in_expressions_from_macros = "warn"
trivial_numeric_casts = "warn"
unexpected_cfgs = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"

trivial_casts = "allow"
unused_qualifications = "allow"

[workspace.lints.rustdoc]
all = "warn"
missing_crate_level_docs = "warn"
private_intra_doc_links = "allow"

[workspace.lints.clippy]
as_ptr_cast_mut = "warn"
await_holding_lock = "warn"
bool_to_int_with_if = "warn"
char_lit_as_u8 = "warn"
checked_conversions = "warn"
clear_with_drain = "warn"
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
derive_partial_eq_without_eq = "warn"
disallowed_macros = "warn"
disallowed_methods = "warn"
disallowed_names = "warn"
disallowed_script_idents = "warn"
disallowed_types = "warn"
doc_link_with_quotes = "warn"
doc_markdown = "warn"
empty_enums = "warn"
empty_line_after_outer_attr = "warn"
enum_glob_use = "warn"
equatable_if_let = "warn"
exit = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
fn_to_numeric_cast_any = "warn"
from_iter_instead_of_collect = "warn"
get_unwrap = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
index_refutable_slice = "warn"
inefficient_to_string = "warn"
infinite_loop = "warn"
into_iter_without_iter = "warn"
invalid_upcast_comparisons = "warn"
iter_filter_is_ok = "warn"
iter_filter_is_some = "warn"
iter_not_returning_iterator = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_over_hash_type = "warn"
iter_without_into_iter = "warn"
large_digit_groups = "warn"
large_include_file = "warn"
large_stack_arrays = "warn"
large_stack_frames = "warn"
large_types_passed_by_value = "warn"
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_assert = "warn"
manual_clamp = "warn"
manual_instant_elapsed = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_ok_or = "warn"
manual_string_new = "warn"
map_err_ignore = "warn"
map_flatten = "warn"
match_bool = "warn"
match_same_arms = "warn"
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
mismatching_type_param_order = "warn"
missing_enforced_import_renames = "warn"
missing_safety_doc = "warn"
mixed_attributes_style = "warn"
mut_mut = "warn"
mutex_integer = "warn"
needless_borrow = "warn"
needless_continue = "warn"
needless_for_each = "warn"
needless_pass_by_ref_mut = "warn"
needless_pass_by_value = "warn"
negative_feature_names = "warn"
nonstandard_macro_braces = "warn"
option_as_ref_cloned = "warn"
option_option = "warn"
path_buf_push_overwrite = "warn"
print_stderr = "warn"
print_stdout = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
pub_underscore_fields = "warn"
pub_without_shorthand = "warn"
rc_mutex = "warn"
readonly_write_lock = "warn"
redundant_type_annotations = "warn"
ref_as_ptr = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "warn"
single_char_pattern = "warn"
single_match_else = "warn"
str_split_at_newline = "warn"
str_to_string = "warn"
string_add = "warn"
string_add_assign = "warn"
string_lit_as_bytes = "warn"
string_lit_chars_any = "warn"
suspicious_command_arg_space = "warn"
suspicious_xor_used_as_pow = "warn"
todo = "warn"
too_long_first_doc_paragraph = "warn"
too_many_lines = "warn"
trailing_empty_array = "warn"
trait_duplication_in_bounds = "warn"
tuple_array_conversions = "warn"
unchecked_time_subtraction = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
uninhabited_references = "warn"
uninlined_format_args = "warn"
unnecessary_box_returns = "warn"
unnecessary_safety_doc = "warn"
unnecessary_struct_initialization = "warn"
unnecessary_wraps = "warn"
unnested_or_patterns = "warn"
unused_peekable = "warn"
unused_rounding = "warn"
unused_self = "warn"
unused_trait_names = "warn"
use_self = "warn"
useless_transmute = "warn"
verbose_file_reads = "warn"
wildcard_dependencies = "warn"
wildcard_imports = "warn"
zero_sized_map_values = "warn"

manual_range_contains = "allow" # this one is just worse imho
map_unwrap_or = "allow"         # so is this one
self_named_module_files = "allow" # rerun uses foo.rs + foo/ style
significant_drop_tightening = "allow" # False positives
